[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "driftguard"
version = "0.1.0"
description = "Enterprise Data Contract & Schema Drift Monitor"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ali Boyaci" },
]
keywords = ["schema", "drift", "data-contract", "cli", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<14",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "pyarrow>=15,<20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "pre-commit>=3,<5",
    "types-PyYAML>=6,<7",
]

[project.scripts]
driftguard = "driftguard.cli.app:app"

[project.urls]
Repository = "https://github.com/aaliboyaci/DriftGuard"
Issues = "https://github.com/aaliboyaci/DriftGuard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/driftguard"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
