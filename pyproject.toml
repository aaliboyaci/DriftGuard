[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "driftguard-contracts"
version = "1.0.1"
description = "Detect schema and data contract drift across databases, APIs, and files before it breaks production"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ali Boyaci" },
]
keywords = [
    "schema",
    "drift",
    "data-contract",
    "breaking-change",
    "schema-validation",
    "data-quality",
    "ci-gate",
    "openapi",
    "postgres",
    "data-engineering",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12,<1",
    "rich>=13,<14",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "pyarrow>=15,<20",
]

[project.optional-dependencies]
s3 = ["boto3>=1.28,<2"]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.4,<1",
    "mypy>=1.10,<2",
    "pre-commit>=3,<5",
    "types-PyYAML>=6,<7",
]

[project.scripts]
driftguard = "driftguard.cli.app:app"

[project.urls]
Homepage = "https://github.com/aaliboyaci/DriftGuard"
Repository = "https://github.com/aaliboyaci/DriftGuard"
Documentation = "https://github.com/aaliboyaci/DriftGuard/tree/main/docs"
Issues = "https://github.com/aaliboyaci/DriftGuard/issues"
Changelog = "https://github.com/aaliboyaci/DriftGuard/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/driftguard"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM108", "UP042", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
